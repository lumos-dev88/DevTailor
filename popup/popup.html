<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: #1e293b;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header h2 {
      font-size: 16px;
      font-weight: 700;
    }
    .badge {
      background: #ef4444;
      color: white;
      border-radius: 12px;
      min-width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      padding: 0 6px;
    }
    .badge--zero { background: #475569; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
    }
    .toggle-track {
      display: block;
      width: 34px;
      height: 18px;
      border-radius: 9px;
      background: #475569;
      position: relative;
      transition: background 0.2s;
      pointer-events: none;
    }
    .toggle-thumb {
      display: block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #94a3b8;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-btn.active .toggle-track { background: #3b82f6; }
    .toggle-btn.active .toggle-thumb { transform: translateX(16px); background: #f8fafc; }
    body.disabled #main-content,
    body.disabled #no-page,
    body.disabled .status,
    body.disabled .divider:first-of-type { opacity: 0.35; pointer-events: none; }
    .status {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .status strong { color: #f8fafc; }
    .divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin: 12px 0;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: #334155;
      color: #f8fafc;
      font-size: 13px;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #475569; }
    .btn:active { transform: scale(0.98); }
    .btn--primary { background: #3b82f6; border-color: #3b82f6; }
    .btn--primary:hover { background: #2563eb; }
    .btn-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .btn-label { flex: 1; text-align: left; }
    .prompt-group { margin-top: 6px; display: none; flex-direction: column; gap: 4px; }
    .prompt-group.open { display: flex; }
    .prompt-btn {
      display: block;
      width: 100%;
      padding: 7px 10px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: #1e293b;
      color: #94a3b8;
      font-size: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .prompt-btn:hover { background: #334155; color: #f8fafc; }
    .toast {
      display: none;
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: white;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show { display: block; }
    .no-page {
      color: #64748b;
      font-size: 13px;
      text-align: center;
      padding: 20px 0;
    }

    /* Allowed Sites */
    .site-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .site-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 5px;
      background: #334155;
      font-size: 12px;
      font-family: 'SF Mono', 'Consolas', monospace;
      color: #cbd5e1;
    }
    .site-item--default { opacity: 0.7; }
    .site-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .site-tag {
      font-size: 10px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #64748b;
      background: #1e293b;
      padding: 1px 6px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .site-remove {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .site-remove:hover { color: #ef4444; }
    .add-site-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .add-site-input {
      flex: 1;
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
      color: #f8fafc;
      font-size: 12px;
      font-family: 'SF Mono', 'Consolas', monospace;
      outline: none;
    }
    .add-site-input::placeholder { color: #475569; }
    .add-site-input:focus { border-color: #3b82f6; }
    .add-site-btn {
      padding: 6px 12px;
      border-radius: 5px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 12px;
      font-weight: 600;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .add-site-btn:hover { background: #2563eb; }
    .add-site-error {
      display: none;
      font-size: 11px;
      color: #f87171;
      margin-top: 4px;
    }
    .size-presets {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .size-preset {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #334155;
      color: #cbd5e1;
      border-radius: 6px;
      padding: 7px 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .size-preset:hover {
      background: #475569;
      color: #f8fafc;
    }
    .size-preset.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
    }
    .custom-size-row {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .custom-size-row.show { display: grid; }
    .size-apply {
      grid-column: 1 / -1;
      padding: 7px 10px;
      border-radius: 5px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .size-input {
      min-width: 0;
      padding: 7px 8px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
      color: #f8fafc;
      font-size: 12px;
      font-family: 'SF Mono', 'Consolas', monospace;
      outline: none;
    }
    .size-input:focus { border-color: #3b82f6; }
    .size-hint {
      margin-top: 6px;
      color: #64748b;
      font-size: 11px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>DevTailor</h2>
    <div class="header-right">
      <span class="badge badge--zero" id="count">0</span>
      <button class="toggle-btn" id="toggle-btn" title="启用/禁用扩展">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </button>
    </div>
  </div>
  <div class="status" id="status">加载中...</div>
  <hr class="divider">

  <div id="main-content">
    <div class="section-title">侧边栏</div>
    <div class="btn-group">
      <button class="btn btn--primary" id="btn-toggle-sidebar">
        <span class="btn-icon">&#9776;</span>
        <span class="btn-label">切换侧边栏</span>
      </button>
    </div>
  </div>

  <div id="no-page" class="no-page" style="display:none;">
    扩展在此页面未激活。<br>请在下方添加当前站点，或打开已允许的页面。
  </div>

  <hr class="divider">
  <div id="panel-size-section">
    <div class="section-title">悬浮卡片尺寸</div>
    <div class="size-presets" id="size-presets">
      <button class="size-preset" data-size-mode="compact">紧凑</button>
      <button class="size-preset" data-size-mode="default">默认</button>
      <button class="size-preset" data-size-mode="wide">宽屏</button>
      <button class="size-preset" data-size-mode="custom">自定义</button>
    </div>
    <div class="custom-size-row" id="custom-size-row">
      <input class="size-input" id="custom-width" type="number" min="320" max="960" step="10" placeholder="宽度">
      <input class="size-input" id="custom-height" type="number" min="420" max="900" step="10" placeholder="高度">
      <button class="size-apply" id="custom-size-apply">应用</button>
    </div>
    <div class="size-hint" id="size-hint">用于调整页面中的 DevTailor 聊天卡片宽度和高度。</div>
  </div>

  <hr class="divider">
  <div id="allowed-sites-section">
    <div class="section-title">允许的站点</div>
    <ul class="site-list" id="site-list"></ul>
    <div class="add-site-row">
      <input type="text" class="add-site-input" id="add-site-input" placeholder="192.168.1.50:3000">
      <button class="add-site-btn" id="add-site-btn">添加</button>
    </div>
    <div class="add-site-error" id="add-site-error"></div>
  </div>

  <div class="toast" id="toast">已复制！</div>

  <script src="popup.js"></script>
</body>
</html>
