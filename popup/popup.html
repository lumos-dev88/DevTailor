<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #0f172a; color: #f8fafc; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .actions { display: grid; gap: 8px; }
    button { width: 100%; padding: 10px 12px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: #1e293b; color: inherit; font: inherit; cursor: pointer; text-align: left; }
    button.primary { background: #2563eb; border-color: transparent; font-weight: 600; }
    button:disabled { opacity: .6; cursor: wait; }
    .note { margin: 10px 0 0; color: #94a3b8; font-size: 11px; line-height: 1.5; }
    #status { min-height: 18px; margin-top: 10px; color: #fca5a5; font-size: 11px; line-height: 1.45; }
  </style>
</head>
<body>
  <h2>DevTailor</h2>
  <div class="actions">
    <button class="primary" id="takeover">接管当前页</button>
    <button id="open-sidepanel">打开 Chat 侧边栏</button>
  </div>
  <p class="note">只在你主动接管后向当前 http/https 页面注入标记工具。刷新和跳转后会自动恢复。</p>
  <div id="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
