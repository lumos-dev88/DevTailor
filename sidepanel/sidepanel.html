<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTailor Chat</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <button class="connection-chip" id="status-dot" type="button" title="检查连接" aria-label="Bridge 状态">
        <span class="status-dot__pip" id="bridge-pip"></span>
        <span id="bridge-status">检查中…</span>
      </button>
      <select class="topbar__instance" id="instance-select" title="Claude Code 实例" aria-label="Claude Code 实例">
        <option value="">自动（检查中…）</option>
      </select>
      <div class="topbar__actions">
        <button class="topbar-btn" id="btn-takeover" type="button" title="向当前网页注入 DevTailor 并接管">接管当前页</button>
        <button class="topbar-btn" id="btn-new-session" type="button" title="新建会话">新会话</button>
      </div>
    </div>

    <div class="meta-strip" id="meta-strip">
      <div class="meta-strip__row">
        <span class="meta-strip__label">Runtime</span>
        <span class="meta-strip__value" id="runtime-label">-</span>
      </div>
      <div class="meta-strip__row">
        <span class="meta-strip__label">Active Tab</span>
        <span class="meta-strip__value" id="active-tab">-</span>
      </div>
    </div>

    <!-- Current session title -->
    <div class="session-bar" id="session-bar">
      <span class="session-bar__title" id="session-title" title="">未选择会话</span>
      <!-- 最近一次工具调用的极简状态（工具名 + 状态；不是聊天消息，默认隐藏） -->
      <span id="tool-status" class="tool-status" role="status" aria-live="polite" hidden>
        <span class="tool-status__dot" aria-hidden="true"></span>
        <span class="tool-status__text" id="tool-status-text"></span>
      </span>
      <span class="prompt-ctx" id="prompt-ctx" hidden></span>
    </div>

    <!-- Design spec (DESIGN.md) manager, collapsed by default -->
    <section class="design-docs" id="design-docs" aria-label="设计规范">
      <button class="design-docs__head" id="design-docs-toggle" type="button" aria-expanded="false" aria-controls="design-docs-body">
        <span class="design-docs__chev" aria-hidden="true"></span>
        <span class="design-docs__title">设计规范</span>
        <span class="design-docs__summary" id="design-docs-summary">未添加</span>
      </button>
      <div class="design-docs__body" id="design-docs-body" hidden>
        <ul class="dd-list" id="design-docs-list"></ul>
        <div class="dd-error" id="design-docs-error" role="alert" hidden></div>
        <div class="dd-actions">
          <button class="topbar-btn" id="design-docs-upload" type="button">上传 .md</button>
          <input id="design-docs-file" type="file" accept=".md,.markdown,.txt" multiple hidden>
          <span class="dd-hint">启用的文件只把路径交给 AI，由它自行读取并遵守；单文件 ≤256KB，最多 10 个。</span>
        </div>
      </div>
    </section>

    <div class="status-banner" id="status-banner" role="status" hidden></div>

    <!-- Message stream -->
    <main class="stream" id="stream">
      <!-- Welcome state (hidden once messages exist) -->
      <div class="welcome" id="welcome">
        <h2 class="welcome__title">你好，开发助手</h2>
        <p class="welcome__sub">指出页面问题，附上元素上下文，再让 Claude Code 定位和修复。</p>
        <div class="welcome__suggestions" id="welcome-suggestions">
          <button class="chip" data-q="检查这个页面的可访问性问题">检查可访问性</button>
          <button class="chip" data-q="这个布局在移动端有什么问题？">移动端适配</button>
          <button class="chip" data-q="帮我优化首屏加载性能">性能优化</button>
          <button class="chip" data-q="检查表单的验证逻辑">表单验证</button>
        </div>
      </div>

      <!-- Messages rendered here -->
      <div class="messages" id="messages"></div>
    </main>

    <button class="chat-jump" id="chat-jump" type="button">回到底部</button>
    <div class="sidepanel-hint" id="sidepanel-hint">标记和截图会作为 AI 上下文附加到下一条消息</div>

    <!-- Mark tray: page marks + screenshots that ride along with the next message (hidden when empty) -->
    <section class="mark-tray" id="mark-tray" hidden aria-label="待发送的页面标记">
      <div class="mark-tray__head">
        <button type="button" class="mark-tray__toggle" id="mark-tray-toggle" aria-expanded="true" aria-controls="mark-tray-body">
          <span class="mark-tray__chev" aria-hidden="true"></span>
          <span id="mark-tray-title">页面标记</span>
        </button>
        <button type="button" class="mark-tray__link" id="mark-tray-clear-sent" hidden>清除已发送</button>
        <button type="button" class="mark-tray__link mark-tray__link--danger" id="mark-tray-clear-all" hidden>清空全部标记</button>
      </div>
      <div class="mark-tray__body" id="mark-tray-body"></div>
    </section>

    <!-- References tray: pending 参考元素 (independent of marks; shown whenever there are any) -->
    <section class="ref-tray" id="ref-tray" hidden aria-label="待发送的参考元素">
      <div class="mark-tray__head">
        <button type="button" class="mark-tray__toggle" id="ref-tray-toggle" aria-expanded="true" aria-controls="ref-tray-body">
          <span class="mark-tray__chev" aria-hidden="true"></span>
          <span id="ref-tray-title">参考 0</span>
        </button>
        <button type="button" class="mark-tray__link mark-tray__link--danger" id="ref-tray-clear" hidden>清空参考</button>
      </div>
      <div class="mark-tray__body" id="ref-tray-body"></div>
    </section>

    <!-- Composer -->
    <form class="composer" id="composer">
      <div class="composer__input-wrap">
        <div class="dt-screenshot-preview" id="screenshot-preview" aria-live="polite"></div>
        <textarea id="prompt" rows="1" placeholder="输入消息…" aria-label="消息输入"></textarea>
        <div class="composer__toolbar">
          <div class="composer__actions">
            <button type="button" class="icon-btn" id="btn-attach" title="添加图片" aria-label="添加图片">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M5.2 8.5L8.7 5C9.6 4.1 11 4.1 11.9 5C12.8 5.9 12.8 7.3 11.9 8.2L7.4 12.7C6 14.1 3.8 14.1 2.4 12.7C1 11.3 1 9.1 2.4 7.7L7.3 2.8C9.2 0.9 12.2 0.9 14.1 2.8C16 4.7 16 7.7 14.1 9.6L10.2 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" class="icon-btn" title="标记元素" aria-label="标记页面元素" disabled>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 2V4M8 12V14M2 8H4M12 8H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="8" cy="8" r="3.5" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
          </div>
          <input id="image-file-input" type="file" accept="image/*" multiple hidden>
          <div class="composer__send-group">
            <!-- 仅在有未决审批/提问或工具运行中时显示；不阻塞发送 -->
            <button type="button" class="send-btn dt-send-btn--stop" id="cancel-btn" title="取消当前任务" aria-label="取消当前任务" hidden>取消</button>
            <button type="submit" class="send-btn" id="send-btn" title="发送" aria-label="发送" disabled>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 3.2V12.8M8 3.2L4.4 6.8M8 3.2L11.6 6.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="dt-image-lightbox" id="image-lightbox" hidden aria-hidden="true">
    <button type="button" class="dt-image-lightbox__close" id="image-lightbox-close" aria-label="关闭图片预览">×</button>
    <img class="dt-image-lightbox__img" id="image-lightbox-img" alt="图片预览">
  </div>

  <script src="../lib/marked.umd.js"></script>
  <script src="../content/modules/chat-markdown.js"></script>
  <script src="../content/modules/chat-images.js"></script>
  <script src="../content/modules/chat-scroll.js"></script>
  <script src="../content/modules/message-store.js"></script>
  <script src="../content/modules/bridge-core.js"></script>
  <script src="../background/instance-header.js"></script>
  <script src="../content/modules/marks-core.js"></script>
  <script src="../content/modules/chat-render.js"></script>
  <script src="../content/modules/chat-styles.js"></script>
  <script src="../content/modules/chat-conversation.js"></script>
  <script src="../content/modules/references-core.js"></script>
  <script src="mark-tray.js"></script>
  <script src="references-tray.js"></script>
  <script src="design-docs.js"></script>
  <script src="tool-status.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
